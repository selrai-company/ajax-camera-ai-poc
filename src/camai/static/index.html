<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Morning brief</title>
<style>
  :root{--bg:#0e1013;--card:#171a1f;--fg:#e9eaec;--mut:#9a9ea7;--bd:#2a2e36;--red:#e5484d;--amb:#f5a524;--grn:#30a46c;--r:12px}
  @media (prefers-color-scheme: light){:root{--bg:#f6f7f9;--card:#fff;--fg:#14161a;--mut:#5f6570;--bd:#e1e4e8}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:880px;margin:0 auto;padding:24px 16px 60px}
  header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-size:20px;margin:0}
  .mut{color:var(--mut)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--bd);background:transparent;color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer;font:inherit}
  .tab.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:12px}
  .hero{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .hero h2{font-size:17px;margin:2px 0 4px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--bd);color:var(--mut);white-space:nowrap}
  .chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
  .needs_look{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
  .fyi,.camera_issue{color:var(--amb);border-color:color-mix(in srgb,var(--amb) 45%,transparent)}
  .all_good{color:var(--grn);border-color:color-mix(in srgb,var(--grn) 45%,transparent)}
  .time{font:12px ui-monospace,Menlo,monospace;color:var(--mut)}
  .title{font-weight:600}
  .inc{padding:0;overflow:hidden}
  .inchd{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:14px 16px;border-bottom:1px solid var(--bd)}
  .inchd b{font-size:15px}
  .row{display:grid;grid-template-columns:52px 120px 1fr 16px;gap:12px;align-items:center;padding:10px 16px;cursor:pointer;border-top:1px solid var(--bd)}
  .inchd + .row{border-top:0}
  .row:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}
  .row img{width:120px;aspect-ratio:16/10;object-fit:cover;border-radius:5px;background:#000;display:block}
  .row .cam{font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:center;margin-bottom:2px}
  .row .caret{color:var(--mut);transition:transform .15s;font-size:18px}
  .row.open .caret{transform:rotate(90deg)}
  .detail{display:none;padding:0 16px 16px}
  .row.open + .detail{display:block}
  .strip{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:6px 0 10px}
  .strip img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:5px;background:#000;display:block;cursor:zoom-in}
  .strip .crop{outline:2px solid var(--red);outline-offset:-2px}
  .reasons{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
  p{margin:6px 0}
  details summary{cursor:pointer;color:var(--mut);font-size:13px}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .btn{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--fg);cursor:pointer}
  .btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .btn:disabled{opacity:.55;cursor:default}
  video{width:100%;border-radius:8px;margin-top:10px;background:#000}
  .ign{display:flex;gap:10px;padding:6px 0;border-top:1px dashed var(--bd);font-size:13px;align-items:center}
  .ign img{width:72px;aspect-ratio:16/10;object-fit:cover;border-radius:4px}
  .foot{font-size:12px;color:var(--mut);margin-top:8px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;display:none}
  #zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9}
  #zoom img{max-width:94vw;max-height:90vh;border-radius:8px}
  @media (max-width:620px){.strip{grid-template-columns:repeat(4,1fr)}.row{grid-template-columns:44px 1fr 16px}.row img{display:none}}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Morning brief</h1><div class="mut" id="sub">Loading…</div></div>
    <div class="tabs" id="tabs"></div>
  </header>
  <div id="app"></div>
</main>
<div class="toast" id="toast"></div>
<div id="zoom" onclick="this.style.display='none'"><img alt=""></div>
<script>
const LABEL = {needs_look: "Needs a look", fyi: "For your info", camera_issue: "Camera issue", all_good: "All good", ignore: "Ignored"};
const COLOR = {needs_look: "var(--red)", fyi: "var(--amb)", camera_issue: "var(--amb)", all_good: "var(--grn)"};
const RANK = {needs_look: 0, camera_issue: 1, fyi: 2};
let current = null;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const hm = iso => iso.slice(11, 16);
const media = (e, f) => `/media/${e.media.dir}/${f}`;
const chip = (sev, text) => `<span class="chip ${sev}"><i style="background:${COLOR[sev] || "var(--mut)"}"></i>${esc(text || LABEL[sev])}</span>`;

function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(() => t.style.display = "none", 2800); }
function zoom(src) { const z = document.getElementById("zoom"); z.querySelector("img").src = src; z.style.display = "flex"; }
function pick(arr, n) { if (arr.length <= n) return arr; return Array.from({length: n}, (_, i) => arr[Math.round(i * (arr.length - 1) / (n - 1))]); }
function thumb(e) {
  const f = e.media.frames;
  if (f && f.length) return media(e, f[Math.floor(f.length / 2)]);
  return e.media.still ? media(e, e.media.still) : "";
}

function detail(e) {
  const r = e.report || {};
  const frames = pick(e.media.frames || [], e.media.crop ? 7 : 8).map(f => `<img src="${media(e, f)}" alt="" onclick="zoom(this.src)">`).join("");
  const crop = e.media.crop ? `<img class="crop" src="${media(e, e.media.crop)}" alt="Close-up" title="Close-up of the moving area" onclick="zoom(this.src)">` : "";
  const still = e.media.still ? `<img src="${media(e, e.media.still)}" alt="" onclick="zoom(this.src)">` : "";
  const carried = (r.items_carried || []).length ? `<span class="chip">Carrying: ${esc(r.items_carried.join(", "))}</span>` : "";
  const cant = (r.cant_tell || []).length ? `<p class="mut">Can't tell: ${esc(r.cant_tell.join("; "))}.</p>` : "";
  const more = r.movement || cant ? `<details><summary>What the AI saw, frame by frame</summary><p>${esc(r.movement)}</p>${cant}</details>` : "";
  return `<div class="strip">${frames}${crop}${still}</div>
    <div class="reasons">${e.reasons.map(x => `<span class="chip">${esc(x)}</span>`).join("")}${carried}${r.confidence ? `<span class="chip">AI confidence: ${esc(r.confidence)}</span>` : ""}</div>
    ${r.summary ? `<p>${esc(r.summary)}</p>` : ""}${more}
    <div class="acts">
      ${e.media.clip ? `<button class="btn pri" onclick="playClip(event, ${e.id}, '${media(e, e.media.clip)}', this)">Watch clip (${Math.round(e.end_s - e.start_s)}s)</button>` : ""}
      ${e.report ? `<button class="btn" onclick="notAProblem(event, ${e.id}, this)">Not a problem</button>` : ""}
    </div>`;
}

function row(e, open) {
  return `<div class="row${open ? " open" : ""}" onclick="this.classList.toggle('open')">
      <span class="time">${hm(e.ts)}</span>
      <img src="${thumb(e)}" alt="">
      <div><div class="cam">${esc(e.camera_name)} ${chip(e.severity)}</div><div class="title">${esc(e.title)}</div></div>
      <span class="caret">›</span>
    </div><div class="detail" id="ev${e.id}">${detail(e)}</div>`;
}

// Events within 10 minutes of each other read as one incident.
function incidents(events) {
  const out = [];
  for (const e of [...events].sort((a, b) => a.ts.localeCompare(b.ts))) {
    const t = Date.parse(e.ts), end = t + (e.end_s - e.start_s) * 1000, last = out[out.length - 1];
    if (last && t - last.end <= 10 * 60 * 1000) { last.events.push(e); last.end = Math.max(last.end, end); }
    else out.push({events: [e], end});
  }
  for (const g of out) g.sev = g.events.map(e => e.severity).sort((a, b) => RANK[a] - RANK[b])[0];
  return out.sort((a, b) => RANK[a.sev] - RANK[b.sev] || a.events[0].ts.localeCompare(b.events[0].ts));
}

function incidentCard(g, first) {
  const cams = [...new Set(g.events.map(e => e.camera_name))];
  const endHm = new Date(g.end).toTimeString().slice(0, 5);
  const span = endHm !== hm(g.events[0].ts) ? `${hm(g.events[0].ts)} to ${endHm}` : hm(g.events[0].ts);
  return `<div class="card inc">
    <div class="inchd"><div><b>${span}</b> <span class="mut">· ${cams.length} camera${cams.length > 1 ? "s" : ""}: ${esc(cams.join(" → "))}</span></div>${chip(g.sev)}</div>
    ${g.events.map((e, i) => row(e, first && i === 0)).join("")}
  </div>`;
}

function render(b) {
  current = b;
  document.getElementById("sub").textContent = `${b.site.name} · armed ${b.site.armed} · ${b.cameras.length} camera${b.cameras.length > 1 ? "s" : ""}`;
  const flagged = b.events.filter(e => e.severity !== "ignore");
  const ignored = b.events.filter(e => e.severity === "ignore");
  const groups = incidents(flagged);
  const ignoredList = ignored.map(e => `<div class="ign">${thumb(e) ? `<img src="${thumb(e)}" alt="" onclick="zoom(this.src)">` : ""}
      <span class="time">${hm(e.ts)}</span><span>${esc(e.camera_name)}: ${esc(e.title)}</span><span class="mut">· ${esc(e.reasons[0])}</span></div>`).join("");
  document.getElementById("app").innerHTML = `
    <div class="card hero">
      <div><div class="mut" style="font-size:12px">What happened overnight</div><h2>${esc(b.headline)}</h2>
      <div class="mut" style="font-size:13px">${groups.length} incident${groups.length === 1 ? "" : "s"} to review · ${ignored.length} movement${ignored.length === 1 ? "" : "s"} checked and ignored</div></div>
      ${chip(b.status)}
    </div>
    ${groups.map((g, i) => incidentCard(g, i === 0)).join("")}
    ${ignored.length ? `<div class="card"><details><summary>Checked and ignored (${ignored.length}): why each one didn't need you</summary>${ignoredList}</details></div>` : ""}
    <p class="foot">The AI describes what's visible; your site rules decide what needs you. Estimated AI cost of this brief at API prices: $${b.est_api_cost_usd.toFixed(4)}.</p>`;
}

async function load(siteId) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.id === siteId));
  const r = await fetch(`/api/sites/${siteId}/brief`);
  render(await r.json());
}

function playClip(ev, id, src, btn) {
  ev.stopPropagation();
  const box = document.getElementById("ev" + id);
  let v = box.querySelector("video");
  if (v) { v.remove(); btn.textContent = btn.textContent.replace("Hide", "Watch"); return; }
  v = document.createElement("video");
  Object.assign(v, {src, controls: true, autoplay: true, muted: true, playsInline: true});
  box.appendChild(v);
  btn.textContent = btn.textContent.replace("Watch", "Hide");
}

async function notAProblem(ev, id, btn) {
  ev.stopPropagation();
  btn.disabled = true;
  const r = await (await fetch(`/api/events/${id}/not-a-problem`, {method: "POST"})).json();
  toast(`Saved site rule: ${r.note}`);
  await load(current.site.id);
}

(async () => {
  const sites = await (await fetch("/api/sites")).json();
  document.getElementById("tabs").innerHTML = sites.length > 1
    ? sites.map(s => `<button class="tab" data-id="${s.id}" onclick="load('${s.id}')">${esc(s.name)}</button>`).join("") : "";
  if (sites.length) load(sites[0].id);
})();
</script>
</body>
</html>
